<!doctype html><html><head><meta charset="utf-8"><title>Blind Hand Coding</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font:15px/1.5 -apple-system,system-ui,sans-serif;margin:0;background:#f6f7f9;color:#1a1a1a}
header{background:#1f2937;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
main{display:grid;grid-template-columns:1fr 380px;gap:16px;padding:16px;max-width:1300px;margin:auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:16px}
.src{max-height:78vh;overflow:auto}
h3{margin:18px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:#4b5563}
blockquote{margin:6px 0;padding:6px 10px;border-left:3px solid #3b82f6;background:#eff6ff}
.meta{color:#6b7280;font-size:13px;word-break:break-all}
label{display:block;font-weight:600;margin-top:12px}
small{display:block;font-weight:400;color:#6b7280}
select,textarea{width:100%;padding:6px;font:inherit;margin-top:4px}
.themes label{font-weight:400;margin:2px 0}
button{background:#2563eb;color:#fff;border:0;border-radius:6px;padding:8px 14px;font:inherit;cursor:pointer}
button.sec{background:#e5e7eb;color:#111}
.nav{display:flex;gap:8px;margin-top:16px}
.dots span{display:inline-block;width:10px;height:10px;border-radius:50%;background:#6b7280;margin:0 2px}
.dots span.done{background:#22c55e}.dots span.cur{outline:2px solid #fff}
</style></head><body>
<header><b>Blind hand coding: <span id="title"></span></b><span class="dots" id="dots"></span>
<button onclick="exportCsv()">Download human_coding.csv</button></header>
<main><div class="card src" id="src"></div>
<div class="card"><form id="f">
<label>policy_level<small>dept if dept_statement has a URL; else university; else course_only</small>
<select name="policy_level"><option></option><option>dept</option><option>university</option><option>course_only</option><option>none_found</option></select></label>
<label>default_rule<small>Dept text first, then university. "Not allowed unless instructor permits" = banned</small>
<select name="default_rule"><option></option><option>banned</option><option>instructor_discretion</option><option>allowed_with_disclosure</option><option>allowed_encouraged</option><option>unclear</option></select></label>
<label>stance<small>Tone of that same text. −2 hostile … 0 neutral … +2 enthusiastic</small>
<select name="stance"><option></option><option>-2</option><option>-1</option><option>0</option><option>1</option><option>2</option></select></label>
<label>collaboration_framing<small>AI called tutor/partner/teammate, or likened to a human helper to permit use</small>
<select name="collaboration_framing"><option></option><option>true</option><option>false</option></select></label>
<label>disclosure_required<small>yes = must cite/acknowledge AI use; "consider requiring" = unclear</small>
<select name="disclosure_required"><option></option><option>yes</option><option>no</option><option>unclear</option></select></label>
<label>se_course_policy<small>integrated = AI required/taught; allowed = most coding work; limited = some tasks</small>
<select name="se_course_policy"><option></option><option>banned</option><option>limited</option><option>allowed</option><option>integrated</option><option>not_found</option></select></label>
<label>themes<small>Explicitly present in any quote</small></label><div class="themes" id="themes"></div>
<label>notes<textarea name="notes" rows="2"></textarea></label>
</form>
<div class="nav"><button class="sec" onclick="go(-1)">← Prev</button><button onclick="go(1)">Next →</button></div></div></main>
<script>
const DATA=[{"slug": "berkeley", "name": "University of California, Berkeley", "sections": [{"section": "dept_statement", "body": "url: not_found"}, {"section": "university_guidance", "body": "url: https://teaching.berkeley.edu/node/74\nsource_date: undated\n> Some may not even realize that tools like ChatGPT can raise questions about academic integrity. A clearly stated course policy on GenAI use helps ensure that students understand not only what is allowed, but also why.\n\n> The following sample syllabus statements have been provided by UC Berkeley\u2019s Academic Senate. They span a range of approaches, from fully integrating GenAI into coursework to prohibiting it entirely. Instructors are encouraged to adapt these to their specific course context and instructional priorities."}, {"section": "intro_course", "body": "course: CS 61A Structure and Interpretation of Computer Programs, Fall 2026\nurl: https://cs61a.org/fa26/syllabus/\nsource_date: 2026 \"CS 61A has been updated for the Fall 2026 offering\"\n> Do not use AI tools such as Github Copilot or ChatGPT to fill in or correct your code.\n\n> After developing a comprehensive understanding of programming, students will use AI coding agents in their final project to develop a large and complex software application.\n\n> Homeworks will be completed alongside an AI tutor called Preceptor that asks students questions to ensure they understand the code that they have written.\n\ncourse: CS 61B Data Structures, Fall 2026\nurl: https://fa26.datastructur.es/policies/\nsource_date: 2026 \"CS 61B Fall 2026\"\n> allow an LLM or any GenAI tool to read, analyze, or interface with your codebase or your GitHub repository in any way. This means all local and terminal-based tools (e.g., Claude Code and Codex ), GitHub Copilot, built-in IDE extensions (e.g., Cursor, IntelliJ AI Assistant), or any other agentic coding tools are outright banned\n\n> Use LLMs in the same way you might use a friend in the class who is not in your group. You may only use browser-based chatbots to ask high-level, conceptual questions."}, {"section": "se_course", "body": "course: COMPSCI 169A Introduction to Software Engineering, Fall 2026\nurl: https://cs169.org/fa26/syllabus/\nsource_date: 2026 \"Introduction to Software Engineering, Fall 2026\"\n> If you copy-paste code from StackOverflow \u2014 or an AI assistant \u2014 without understanding it, you\u2019re taking credit for others\u2019 work.\n\n> An AI Policy page describing how these rules apply to AI programming assistants and chatbots will be published on this site."}]}, {"slug": "cmu", "name": "Carnegie Mellon University", "sections": [{"section": "dept_statement", "body": "url: not_found"}, {"section": "university_guidance", "body": "url: https://www.cmu.edu/teaching/technology/aitools/index.html\nsource_date: undated\n> The university\u2019s policy on academic integrity is not changing as a response to generative AI tools. According to CMU\u2019s Office of Community Standards and Integrity,\n\n> already implicitly covers such tools, as they may be considered a type of unauthorized assistance. However, this policy is intentionally designed to allow instructors to define what is \u201cauthorized\u201d vs. \u201cunauthorized\u201d and what constitutes \u201cplagiarism\u201d and \u201ccheating.\u201d\n\n> If your policies are not explicitly stated, then your students may NOT be able to effectively interpret what kinds of AI use are authorized or not in your course"}, {"section": "intro_course", "body": "course: 15-112 Fundamentals of Programming, Fall 2026\nurl: https://www.cs.cmu.edu/~112/syllabus.html\nsource_date: 2026 \"15-112, Fall 2026\"\n> We embrace the importance of AI as a powerful tool, even as we also strongly resist AI replacing your learning or your humanity. AI use is allowed and even encouraged on preps, homeworks, labs, and projects. However, at no point can you use AI to replace your thinking or your understanding.\n\n> All AI use is strictly forbidden on all assessments, including comps, quizzes, and exams.\n\ncourse: 15-122 Principles of Imperative Computation, Fall 2026\nurl: https://www.cs.cmu.edu/~15122/syllabus.shtml\nsource_date: 2026 \"CS 15-122: Principles of Imperative Computation (Fall 2026)\"\n> You may not use AI tools for any part of work that you will submit for credit. This includes but is not limited to generating solutions, checking solutions, explaining tasks or solutions, formatting code, adding comments to code, or generating test cases. Use of these tools on assignments will be reported as an academic integrity violation.\n\n> We require that you disable AI extensions from your programming environment and in general that you do not use AI tools."}, {"section": "se_course", "body": "course: 17-313 Foundations of Software Engineering, Fall 2026\nurl: https://cmu-313.github.io/syllabus/\nsource_date: 2026 \"Last Updated: August 21, 2026\"\n> You may use generative AI for any and all coding tasks in the course. However, as we discuss in class, we belive that there are significant implications for your own learning around your AI usage patterns. Our goal for you in this class is that you learn to use AI in a way that helps you become a better software engineer.\n\n> We Very Strongly Discourage using AI to Generate writing responses, but we encourage its use for editing your writing.\n\n> It is your responsibility to validate and verify AI-produced content before submitting it for class purposes."}]}, {"slug": "columbia", "name": "Columbia University", "sections": [{"section": "dept_statement", "body": "url: not_found"}, {"section": "university_guidance", "body": "url: https://ai.ctl.columbia.edu/explore/quick-start-faq/\nsource_date: 2026 \"Last Updated: August 24, 2026\"\n> Yes. Decisions about the use of AI in teaching are made by instructors and academic departments, consistent with Columbia's longstanding commitment to faculty governance, curricular autonomy, and academic freedom.\n\n> Faculty can choose a course AI policy that allows unrestricted student use of AI, prohibits it entirely, or falls somewhere in between.\n\n> recommends that faculty share clear expectations with their students about what constitutes appropriate (and inappropriate) use of AI tools in each of their courses.\n\n> Faculty are discouraged from using AI detectors for the purpose of detecting academic integrity violations. Columbia's Center for Student Success and Intervention (CSSI) advises that AI detection software cannot be used as the sole form of evidence that a student inappropriately used Gen-AI on an assignment."}, {"section": "intro_course", "body": "course: COMS W1004 Introduction to Computer Science and Programming in Java, Fall 2026\nurl: blocked"}, {"section": "se_course", "body": "course: COMS W4156 Advanced Software Engineering, Fall 2026 (Gail Kaiser)\nurl: blocked"}]}, {"slug": "nyu", "name": "New York University", "sections": [{"section": "dept_statement", "body": "url: not_found"}, {"section": "university_guidance", "body": "url: https://www.nyu.edu/faculty/teaching-and-learning-resources/teaching-with-generative-tools/frequently-asked-questions.html\nsource_date: 2026 \"Last Updated Monday, October 5, 2026\"\n> The student must abide by any requirements or limitations the instructor may have in each course.\n\n> AI can be used in a wide variety of ways. Because of its flexibility, there are few standard approaches to its use beyond an institution-wide restriction on taking credit for AI output without acknowledging its use. Most policies will be set by the schools, departments, or by individual faculty members.\n\n> Academic integrity violations can only be defined in a particular context. Using AI to create work for a course violates the rules when a course forbids it, but does not when a course allows it.\n\n> If faculty suspect that a student may have used AI in a way that was not permitted, they should treat it as contract cheating."}, {"section": "intro_course", "body": "course: CSCI-UA 102 Data Structures (sec 10, Klukowska), Fall 2026\nurl: https://cims.nyu.edu/~joannakl/cs102/syllabus.html\nsource_date: undated\n> In this class, we will not ban these tools; instead, we will attempt to show you how to use them to your benefit rather than to your detriment.\n\n> Using AI to do all of your coding work for you will be a detriment to your learning.\n\n> AI as a Partner in Peer Programming: Sometimes AI can be used effectively to speed up coding the ideas that you have. Come up with a detailed step by step algorithm and ask it to generate code that follows those steps exactly.\n\n> Keep in mind that exams and other assessments in this class will not be given with access to AI tools, so you need to be able to write complete programs, implement parts of given programs, answer questions and suggest solutions to problems on your own without the help of any tools."}, {"section": "se_course", "body": "course: CSCI-UA 474 Software Engineering (Amos Bloomberg), Fall 2026\nurl: https://knowledge.kitchen/content/courses/software-engineering/syllabus/\nsource_date: undated\n> All restrictions on sharing, communicating, collaborating, or copying to/from other humans apply equally to generative AI tools, unless explicit permission is given.\n\n> Students are welcome to use generative AI tools, such as ChatGPT, Gemini, GitHub Copilot, etc to assist with researching and understanding the material covered in this course. However, all work submitted for a grade must be a student\u2019s own, written or otherwise fully produced and fully understood by them without direct assistance writing or producing that work from other people or interactive programs like generative AI tools."}]}, {"slug": "williams", "name": "Williams College", "sections": [{"section": "dept_statement", "body": "url: blocked"}, {"section": "university_guidance", "body": "url: blocked"}, {"section": "intro_course", "body": "course: CSCI 134 Introduction to Computer Science (Jeannie Albrecht, Mark Hopkins), Spring 2026\nurl: https://docs.google.com/document/d/1snqY9ReYC2JWbD16v9_Zq48vvVt5Ved74f7jlz7uBks/export?format=html\nsource_date: 2026 \"Course Policies (Spring 2026)\"\n> While ChatGPT and other chatbots are often useful tools for subsequent computer science courses, use of generative AI is not permitted in CSCI 134 ... This is simply because it impedes language acquisition, and a major goal of this course is to become more fluent in both reading and writing code.\n\n> For labs, collaboration with fellow students should be restricted to discussions only\n\ncourse: CSCI 136 Data Structures and Advanced Programming (Sam McCauley), Spring 2026\nurl: https://williams-cs.github.io/cs136-s26/handouts/syllabus.pdf\nsource_date: 2026 \"Spring 2026\"\n> However, LLM usage is not permitted in this class. All assignments are to be done without LLM help. If students are using a code environment with a built-in LLM, it should be turned off.\n\n> The reason why LLMs are not permitted is that the purpose of this class is not to simply to write code, but rather to develop code-writing skills (see the discussion above).\n\n> Students are strongly discouraged from using LLMs for studying at home."}, {"section": "se_course", "body": "url: not_found"}]}];
const ALL=["berkeley","caltech","cmu","columbia","cornell","mit","ncstate","nyu","ucla","williams"];
const THEMES=["academic_integrity","learning_outcomes","career_readiness","specific_tools","equity_access","privacy_security","assessment_redesign","ai_literacy"];
const FIELDS=["policy_level","default_rule","stance","collaboration_framing","disclosure_required","se_course_policy"];
const ans=DATA.map(()=>({themes:[]}));let i=0;
document.getElementById("themes").innerHTML=THEMES.map(t=>`<label><input type="checkbox" value="${t}"> ${t}</label>`).join("");
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function render(){const d=DATA[i];document.getElementById("title").textContent=`${d.name} (${i+1}/${DATA.length})`;
 document.getElementById("src").innerHTML=d.sections.map(s=>`<h3>${s.section}</h3>`+s.body.split("\n").filter(l=>l.trim()).map(l=>l.startsWith(">")?`<blockquote>${esc(l.slice(1).trim())}</blockquote>`:`<div class="meta">${esc(l)}</div>`).join("")).join("");
 const f=document.getElementById("f"),a=ans[i];FIELDS.forEach(k=>f[k].value=a[k]||"");f.notes.value=a.notes||"";
 f.querySelectorAll("#themes input").forEach(c=>c.checked=a.themes.includes(c.value));
 document.getElementById("dots").innerHTML=DATA.map((_,j)=>`<span class="${FIELDS.every(k=>ans[j][k])?"done":""} ${j==i?"cur":""}"></span>`).join("");
 document.getElementById("src").scrollTop=0;}
function save(){const f=document.getElementById("f"),a=ans[i];FIELDS.forEach(k=>a[k]=f[k].value);a.notes=f.notes.value;
 a.themes=[...f.querySelectorAll("#themes input:checked")].map(c=>c.value);}
function go(n){save();i=Math.max(0,Math.min(DATA.length-1,i+n));render();}
document.getElementById("f").addEventListener("change",()=>{save();render();});
function exportCsv(){save();const q=v=>/[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v;
 const rows=[["slug","name","raw_file",...FIELDS,"themes","notes"].join(",")];
 ALL.forEach(s=>{const j=DATA.findIndex(d=>d.slug==s);const a=j>=0?ans[j]:{themes:[]};const n=j>=0?DATA[j].name:"";
  rows.push([s,q(n),`data/raw/${s}.md`,...FIELDS.map(k=>a[k]||""),a.themes.join(";"),q(a.notes||"")].join(","));});
 const b=new Blob([rows.join("\n")+"\n"],{type:"text/csv"});const l=document.createElement("a");
 l.href=URL.createObjectURL(b);l.download="human_coding.csv";l.click();}
render();
</script></body></html>
